name: "CI - Test Features - Azure Functions"
on:
  workflow_dispatch: { }

jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for 'azure-functions' scenarios"
        run: devcontainer features test --features azure-functions --skip-autogenerated --skip-duplicated .
